<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="heart-container">
        <div class="heart"></div>

        <div class="message-container">
            <div class="message">Would You be my Valentine?</div>

            <div class="buttons">
                <button class="yes" onclick="answer('yes')">YES</button>
                <button class="no" onclick="answer('no')">no</button>
            </div>
        </div>
    </div>
    <div class="popup-message" id="popupMessage">
        You made the right choice, I'm glad! I love you forever & can't wait to spend another Valentine's with you
    </div>

    <div class="fireworks"></div>
    <div class="tears"></div>

    <!-- Link JS (IMPORTANT: at bottom) -->
    <script src="script.js"></script>
</body>

</html>
